# Shipped tiers (referenced in the paper):
#   NULL: null_low, fleet_realworld_final (medium/default), null_high
#   MCV:  mcv_low, mcv_fleet_default (medium/default), mcv_high
# Legacy profiles below are preserved for historical reference.

profiles:
  mcv_fleet_default: &mcv_fleet_default
    selection_fraction_scope: overall
    exclude_tables:
      - date_dim
      - time_dim
    exclude_qualified_columns:
      - item.i_category
      - item.i_class
      - item.i_brand
      - item.i_color
      - item.i_size
      - item.i_units
      - item.i_current_price
      - store.s_state
      - store.s_city
      - store.s_zip
      - store.s_county
      - customer_address.ca_state
      - customer_address.ca_city
      - customer_address.ca_zip
      - customer_address.ca_county
      - customer_address.ca_country
      - customer_address.ca_gmt_offset
      - customer_demographics.cd_marital_status
      - customer_demographics.cd_education_status
      - customer_demographics.cd_gender
      - customer_demographics.cd_credit_rating
      - customer.c_preferred_cust_flag
      - customer.c_birth_country
      - household_demographics.hd_buy_potential
      - income_band.ib_lower_bound
      - income_band.ib_upper_bound
      - inventory.inv_quantity_on_hand
      - promotion.p_channel_dmail
      - promotion.p_channel_email
      - promotion.p_channel_tv
      - promotion.p_channel_radio
      - promotion.p_channel_press
      - promotion.p_channel_event
      - promotion.p_channel_demo
      - ship_mode.sm_carrier
      - reason.r_reason_desc
      - store_sales.ss_ext_list_price
      - store_sales.ss_ext_wholesale_cost
      - store_sales.ss_ext_discount_amt
      - store_sales.ss_ext_sales_price
      - catalog_sales.cs_ext_list_price
      - catalog_sales.cs_ext_wholesale_cost
      - catalog_sales.cs_ext_discount_amt
      - catalog_sales.cs_ext_sales_price
      - web_sales.ws_sales_price
      - web_sales.ws_net_profit
      - web_sales.ws_ext_list_price
      - web_sales.ws_ext_wholesale_cost
      - web_sales.ws_ext_discount_amt
      - web_sales.ws_ext_sales_price
    # Target distribution of the TOP-1 (max-value) share -- the fraction of total
    # rows the single most-common value occupies. This is exactly what the Redshift
    # "Maximum MCV frequency" curve measures.
    #
    # Recalibrated 2026-09-01 together with the join-key skew axis (Profil K):
    # the query-derived exclusion now covers only LITERAL-FILTERED columns
    # (query_exclusion_scope: filtered; config/query_filter_columns.txt) so
    # group-by / order-by / aggregate-input columns are skewable, and the bucket
    # table is top-heavy because the key axis is capped at 0.80 and the MCV axis
    # carries the fleet's extreme [0.90, 0.99) mass (payload/group columns do not
    # conjoin multiplicatively the way fact FKs do). Measured at SF10 with the
    # default key tier: 79.5/66.2/50.1/45.0/31.9/19.4 vs fleet 73/60/49/41/33/25
    # (mean |gap| ~4pp, scale-stable SF1..SF10; 107-query gate: 0 errors).
    query_exclusion_scope: filtered
    column_selection_fraction: 0.85
    max_value_buckets:
      - weight: 0.04
        min: 0.01
        max: 0.10
      - weight: 0.05
        min: 0.10
        max: 0.30
      - weight: 0.07
        min: 0.30
        max: 0.50
      - weight: 0.09
        min: 0.50
        max: 0.70
      - weight: 0.15
        min: 0.70
        max: 0.90
      - weight: 0.60
        min: 0.90
        max: 0.99

  # Back-compat alias for the calibration runs: identical to the promoted
  # default above.
  mcv_fleet_scoped:
    <<: *mcv_fleet_default

  mcv_low:
    column_selection_fraction: 0.45
    selection_fraction_scope: overall
    # Same role-scoped exclusion as the default tier (literal-filtered columns
    # stay untouched); only intensity differs.
    query_exclusion_scope: filtered
    exclude_tables:
      - date_dim
      - time_dim
    exclude_qualified_columns:
      - item.i_category
      - item.i_class
      - item.i_brand
      - item.i_color
      - item.i_size
      - item.i_units
      - item.i_current_price
      - store.s_state
      - store.s_city
      - store.s_zip
      - store.s_county
      - customer_address.ca_state
      - customer_address.ca_city
      - customer_address.ca_zip
      - customer_address.ca_county
      - customer_address.ca_country
      - customer_address.ca_gmt_offset
      - customer_demographics.cd_marital_status
      - customer_demographics.cd_education_status
      - customer_demographics.cd_gender
      - customer_demographics.cd_credit_rating
      - customer.c_preferred_cust_flag
      - customer.c_birth_country
      - household_demographics.hd_buy_potential
      - income_band.ib_lower_bound
      - income_band.ib_upper_bound
      - inventory.inv_quantity_on_hand
      - promotion.p_channel_dmail
      - promotion.p_channel_email
      - promotion.p_channel_tv
      - promotion.p_channel_radio
      - promotion.p_channel_press
      - promotion.p_channel_event
      - promotion.p_channel_demo
      - ship_mode.sm_carrier
      - reason.r_reason_desc
      - store_sales.ss_ext_list_price
      - store_sales.ss_ext_wholesale_cost
      - store_sales.ss_ext_discount_amt
      - store_sales.ss_ext_sales_price
      - catalog_sales.cs_ext_list_price
      - catalog_sales.cs_ext_wholesale_cost
      - catalog_sales.cs_ext_discount_amt
      - catalog_sales.cs_ext_sales_price
      - web_sales.ws_sales_price
      - web_sales.ws_net_profit
      - web_sales.ws_ext_list_price
      - web_sales.ws_ext_wholesale_cost
      - web_sales.ws_ext_discount_amt
      - web_sales.ws_ext_sales_price
    # Low-skew tier: most mass in the mild [0.01, 0.30] range, little above 0.5.
    max_value_buckets:
      - weight: 0.30
        min: 0.01
        max: 0.10
      - weight: 0.30
        min: 0.10
        max: 0.30
      - weight: 0.25
        min: 0.30
        max: 0.50
      - weight: 0.12
        min: 0.50
        max: 0.70
      - weight: 0.03
        min: 0.70
        max: 0.85

  mcv_high:
    column_selection_fraction: 1.0
    selection_fraction_scope: overall
    # Same role-scoped exclusion as the default tier; sits ABOVE the calibrated
    # medium (stress tier): full coverage and a heavier extreme tail.
    query_exclusion_scope: filtered
    exclude_tables:
      - date_dim
      - time_dim
    exclude_qualified_columns:
      - item.i_category
      - item.i_class
      - item.i_brand
      - item.i_color
      - item.i_size
      - item.i_units
      - item.i_current_price
      - store.s_state
      - store.s_city
      - store.s_zip
      - store.s_county
      - customer_address.ca_state
      - customer_address.ca_city
      - customer_address.ca_zip
      - customer_address.ca_county
      - customer_address.ca_country
      - customer_address.ca_gmt_offset
      - customer_demographics.cd_marital_status
      - customer_demographics.cd_education_status
      - customer_demographics.cd_gender
      - customer_demographics.cd_credit_rating
      - customer.c_preferred_cust_flag
      - customer.c_birth_country
      - household_demographics.hd_buy_potential
      - income_band.ib_lower_bound
      - income_band.ib_upper_bound
      - inventory.inv_quantity_on_hand
      - promotion.p_channel_dmail
      - promotion.p_channel_email
      - promotion.p_channel_tv
      - promotion.p_channel_radio
      - promotion.p_channel_press
      - promotion.p_channel_event
      - promotion.p_channel_demo
      - ship_mode.sm_carrier
      - reason.r_reason_desc
      - store_sales.ss_ext_list_price
      - store_sales.ss_ext_wholesale_cost
      - store_sales.ss_ext_discount_amt
      - store_sales.ss_ext_sales_price
      - catalog_sales.cs_ext_list_price
      - catalog_sales.cs_ext_wholesale_cost
      - catalog_sales.cs_ext_discount_amt
      - catalog_sales.cs_ext_sales_price
      - web_sales.ws_sales_price
      - web_sales.ws_net_profit
      - web_sales.ws_ext_list_price
      - web_sales.ws_ext_wholesale_cost
      - web_sales.ws_ext_discount_amt
      - web_sales.ws_ext_sales_price
    # High-skew tier: sits above the calibrated medium -- full coverage and an
    # extreme tail beyond the fleet curve. Use with care: aggressive max-value
    # dominance stresses selectivity estimation and grouping hard.
    max_value_buckets:
      - weight: 0.01
        min: 0.01
        max: 0.10
      - weight: 0.02
        min: 0.10
        max: 0.30
      - weight: 0.05
        min: 0.30
        max: 0.50
      - weight: 0.07
        min: 0.50
        max: 0.70
      - weight: 0.15
        min: 0.70
        max: 0.90
      - weight: 0.70
        min: 0.90
        max: 0.99
